<div class="chat-input-area">
  <div class="input-wrapper">
    <button class="attach-btn" type="button" aria-label="Adjuntar archivo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 5v14M5 12h14"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <textarea
      class="message-input"
      rows="1"
      placeholder="Envía un mensaje..."
      aria-label="Mensaje"
    ></textarea>

    <button class="send-btn" type="button" aria-label="Enviar mensaje">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 19V5M5 12l7-7 7 7"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>

  <p class="disclaimer">
    InsForge Chat puede cometer errores. Considera verificar la información importante.
  </p>
</div>
