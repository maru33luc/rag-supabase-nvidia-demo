<div class="chat-main">
  <header class="chat-header">
    <button class="icon-btn mobile-menu" type="button" aria-label="Abrir menú" (click)="onToggleSidebar()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M3 6h18M3 12h18M3 18h18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <button class="model-selector" type="button">
      <span>InsForge RAG</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <div class="header-actions">
      <button class="icon-btn" type="button" aria-label="Compartir">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </header>

  <div class="messages-container">
    <div class="messages-inner">
      @for (message of messages; track $index) {
        <app-chat-message [message]="message" />
      }
    </div>
  </div>

  @if (isProcessing) {
    <div class="processing-indicator">Procesando...</div>
  }

  <app-chat-input [isBusy]="isProcessing" (submit)="onInputSubmit($event)" />
</div>
