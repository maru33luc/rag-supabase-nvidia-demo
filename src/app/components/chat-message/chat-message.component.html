<article class="message" [class.user]="isUser" [class.assistant]="!isUser">
  <div class="message-avatar" [class.user-avatar]="isUser" [class.ai-avatar]="!isUser">
    @if (isUser) {
      <span>M</span>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3h-1v3a4 4 0 0 1-8 0v-3H8a3 3 0 0 1-3-3v-2a3 3 0 0 1 3-3h1V6a4 4 0 0 1 4-4z"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </svg>
    }
  </div>

  <div class="message-body">
    <p class="message-role">{{ avatarLabel }}</p>
    <div class="message-content">
      <p>{{ message.content }}</p>
    </div>
  </div>
</article>
